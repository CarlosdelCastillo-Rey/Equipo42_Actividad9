openapi: 3.0.3

info:
  title: Smart Meeting Assistant API
  version: "1.0.1"
  description: >
    API del Smart Meeting Assistant (SMA). Permite registrar usuarios, proponer
    reuniones, administrar participantes, almacenar resúmenes y generar tareas
    de seguimiento.
    Todas las fechas y horas usan el formato ISO 8601 con zona horaria obligatoria
    (por ejemplo: 2025-11-01T10:00:00-06:00 o 2025-11-01T16:00:00Z).
  contact:
    name: |
      Equipo 42
      Miguel Silva Ramos - A01328387
      José Montante - A01150895
      Hector Jorge Morales Arch - A01796487
      Carlos Del Castillo Rey - A01796595

servers:
  - url: https://firestore.googleapis.com/v1/projects/smart-meeting-assistant-1a3c8/databases/(default)/documents/
    description: Entorno principal (simulado)

paths:

  /users:
    get:
      summary: Listar usuarios conocidos
      description: Devuelve todos los usuarios registrados en el SMA.
      parameters:
        - in: query
          name: email
          schema:
            type: string
          description: Filtrar por email exacto.
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Parámetros inválidos
        "429":
          description: Límite de solicitudes excedido
    post:
      summary: Crear usuario
      description: Registra un nuevo usuario/participante en el sistema.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Clave idempotente para evitar duplicados en reintentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "200":
          description: Reintento idempotente: usuario ya creado previamente con la misma clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Datos incompletos o inválidos
        "429":
          description: Límite de solicitudes excedido

  /users/{userId}:
    get:
      summary: Obtener detalle de usuario
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: ID interno del usuario en SMA.
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Usuario no encontrado
    patch:
      summary: Actualizar usuario
      description: Actualiza datos como zona horaria o correo alterno.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Datos inválidos
        "404":
          description: Usuario no encontrado
        "429":
          description: Límite de solicitudes excedido

  /meetings:
    get:
      summary: Listar reuniones
      description: Lista reuniones filtrando por rango de tiempo o por organizador.
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
          description: Incluir reuniones que inician a partir de esta marca de tiempo (ISO 8601 con zona horaria).
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
          description: Incluir reuniones que terminan antes de esta marca de tiempo (ISO 8601 con zona horaria).
        - in: query
          name: organizerId
          required: false
          schema:
            type: string
          description: Filtrar por el ID del organizador.
      responses:
        "200":
          description: Lista de reuniones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
        "400":
          description: Parámetros inválidos
        "429":
          description: Límite de solicitudes excedido
    post:
      summary: Crear reunión
      description: Crea una reunión propuesta por el asistente.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Clave idempotente para evitar duplicados en reintentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Meeting"
      responses:
        "201":
          description: Reunión creada (tentative/scheduled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "200":
          description: Reintento idempotente: la misma reunión ya fue creada con esa clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "400":
          description: Datos inválidos
        "409":
          description: Conflicto de agenda (solapamiento con otra reunión confirmada)
        "429":
          description: Límite de solicitudes excedido

  /meetings/{meetingId}:
    get:
      summary: Obtener detalles de una reunión
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: string
          description: ID interno de la reunión.
      responses:
        "200":
          description: Reunión encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Reunión no encontrada
    patch:
      summary: Actualizar reunión
      description: Reprogramar la hora, actualizar el título, etc.
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Idempotencia para reintentos seguros.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Meeting"
      responses:
        "200":
          description: Reunión actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "400":
          description: Datos inválidos
        "404":
          description: Reunión no encontrada
        "409":
          description: Conflicto de agenda al reprogramar (solapamiento)
        "429":
          description: Límite de solicitudes excedido
    delete:
      summary: Cancelar reunión
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reunión cancelada/eliminada
        "404":
          description: Reunión no encontrada
        "429":
          description: Límite de solicitudes excedido

  /meetings/{meetingId}/summary:
    post:
      summary: Guardar resumen de la reunión
      description: Sube/actualiza el resumen (notas, acuerdos, decisiones tomadas).
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Idempotencia para evitar duplicados si se reintenta el guardado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summaryText:
                  type: string
                  description: Resumen generado por el asistente o por el usuario.
              required:
                - summaryText
      responses:
        "200":
          description: Resumen guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Reunión no encontrada
        "429":
          description: Límite de solicitudes excedido

  /meetings/{meetingId}/action-items:
    get:
      summary: Listar action items de una reunión
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Reunión no encontrada
        "429":
          description: Límite de solicitudes excedido
    post:
      summary: Crear action item en una reunión
      description: Crea una tarea de seguimiento asignable a un participante.
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Evita crear tareas duplicadas en reintentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Task"
      responses:
        "201":
          description: Action item creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "200":
          description: Reintento idempotente: la tarea ya existía para esa clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Datos inválidos
        "404":
          description: Reunión no encontrada
        "429":
          description: Límite de solicitudes excedido

components:
  schemas:

    User:
      type: object
      description: Representa a un participante/usuario conocido por el SMA.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno del usuario.
        displayName:
          type: string
          description: Nombre legible (por ejemplo, "Karla López").
        email:
          type: string
          format: email
        timezone:
          type: string
          description: Zona horaria IANA, ej. "America/Los_Angeles".
        role:
          type: string
          description: Rol del usuario respecto a una reunión (Organizer, RequiredAttendee, OptionalAttendee).
      required:
        - id
        - displayName
        - email

    Meeting:
      type: object
      description: Reunión gestionada/creada por el Smart Meeting Assistant.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Título o propósito breve de la reunión.
        startTime:
          type: string
          format: date-time
          description: Hora de inicio propuesta/confirmada. Formato ISO 8601 con zona horaria.
        endTime:
          type: string
          format: date-time
          description: Hora de fin propuesta/confirmada. Formato ISO 8601 con zona horaria.
        status:
          type: string
          enum: [tentative, scheduled, cancelled]
          description: Estado actual de la reunión.
        location:
          type: string
          description: Ubicación física o virtual (Teams, Zoom, Sala 2-B).
        participants:
          type: array
          description: Lista de asistentes.
          items:
            $ref: "#/components/schemas/User"
        agenda:
          type: array
          description: Temas planeados.
          items:
            type: string
        summary:
          type: string
          description: Resumen/acta de acuerdos.
        Tasks:
          type: array
          description: Tareas derivadas de la reunión.
          items:
            $ref: "#/components/schemas/Task"
      required:
        - id
        - title
        - startTime
        - endTime
        - participants

    Task:
      type: object
      description: Tarea derivada de una reunión.
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
          description: Acción a realizar.
        ownerUserId:
          type: string
          description: ID del usuario responsable.
        dueDate:
          type: string
          format: date
          description: Fecha límite propuesta (formato ISO 8601).
        status:
          type: string
          enum: [open, in_progress, blocked, done, cancelled]
          description: Estado de ejecución de la tarea.
      required:
        - id
        - description
        - ownerUserId
        - status
